user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format main '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    limit_req_zone $binary_remote_addr zone=zerosum_http:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=zerosum_ws_handshake:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=zerosum_per_ip:10m;
    limit_conn_zone $server_name zone=zerosum_total:10m;
    limit_req_status 429;
    limit_conn_status 429;

    upstream zerosum_app { server app:3000; keepalive 32; }

    include /etc/nginx/conf.d/*.conf;

    server {
        listen 80 default_server;
        server_name zerosum.website www.zerosum.website _;
        client_max_body_size 2m;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
            try_files $uri =404;
        }

        location / {
            return 301 https://zerosum.website$request_uri;
        }
    }

    server {
        listen 443 ssl default_server;
        server_name zerosum.website www.zerosum.website;
        client_max_body_size 2m;

        ssl_certificate /etc/letsencrypt/live/zerosum.website/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/zerosum.website/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        add_header Strict-Transport-Security "max-age=86400" always;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
            try_files $uri =404;
        }

        location = /ws {
            limit_req zone=zerosum_ws_handshake burst=100 nodelay;
            limit_conn zerosum_per_ip 150;
            limit_conn zerosum_total 300;
            proxy_pass http://zerosum_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_socket_keepalive on;
            proxy_read_timeout 24h;
            proxy_send_timeout 24h;
        }

location = /api/ai/generate-pack {
            client_max_body_size 6m;
            limit_req zone=zerosum_http burst=20 nodelay;
            proxy_pass http://zerosum_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_request_buffering off;
            proxy_read_timeout 240s;
            proxy_send_timeout 240s;
        }

        location / {
            limit_req zone=zerosum_http burst=500 nodelay;
            proxy_pass http://zerosum_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 75s;
            proxy_send_timeout 75s;
        }
    }
}
