name: zerosum

services:
  app:
    build:
      context: .
    image: zerosum-app:local
    restart: unless-stopped
    env_file:
      - /etc/zerosum/zerosum.env
    volumes:
      - /var/lib/zerosum:/data
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 640m
    networks:
      - zerosum

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/nginx.docker.conf:/etc/nginx/nginx.conf:ro
      - /etc/zerosum/nginx-conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 96m
    networks:
      - zerosum

networks:
  zerosum:
