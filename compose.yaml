name: zerosum

services:
  app:
    build:
      context: .
    image: zerosum-app:local
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      DATA_DIR: /data
    ports:
      - "${ZEROSUM_PORT:-3000}:3000"
    volumes:
      - zerosum_data:/data

volumes:
  zerosum_data:
